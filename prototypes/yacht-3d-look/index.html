<title>요트 화면 배치 시안</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE — 버리는 코드. 질문: "휴대폰 가로·데스크톱에서 요트 화면은 어떻게 놓여야 하나?"
  2D UI는 디자인 보드(https://claude.ai/artifact/Pu56boShG8unmLSTW8V5hR)에서 고른 B 원작 점수표 스킨을 입혔다.
  v1(태그 prototype-yacht-3d-look-v1)에서 고른 3D 룩(카지노 펠트)은 그대로 두고, 화면 배치만 시안으로 바꿔 본다.
  스펙 docs/specs/yacht.md 「화면 배치」: 세로가 가로보다 길거나 같으면 세로 배치, 가로가 더 길면 가로 배치.
  가로 배치 시안은 ?layout=A|B|C 로 바꾼다(하단 바).
    A 원작형      점수표 왼쪽, 판 오른쪽, 버튼은 판 바로 아래
    B 판 최대형    점수표 왼쪽, 판 가운데, 버튼은 판 오른쪽에 세로로
    C 점수표 강조형 점수표를 넓고 크게, 판 오른쪽, 버튼은 판 아래
    D 세로 B + 가로 A 화면 크기 검사에서 각 방향에 통과한 배치끼리 묶은 것
  세로 배치는 셋 다 같다(턴 표시 / 판 / 버튼 / 점수표, 판은 남은 자리만 쓴다).
  ?players=1..4 로 인원을 바꾼다. ?bar=0 이면 시안 바를 숨긴다(캡처용).
  굴림은 물리 엔진 없이 트윈으로 흉내 낸다. 결과는 로직이 먼저 정한다(ADR-0001).
-->

  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: inherit; border-right: 2px solid #ffd21f; border-bottom: 2px solid #ffd21f; transform: translateX(-50%) rotate(45deg); }
  .bubble.below { transform: translate(-50%, 0); }
  .bubble.below::after { bottom: auto; top: -7px; transform: translateX(-50%) rotate(-135deg); }
  .bubble.release { border-color: #f3e7d3; color: #f3e7d3; }

  table.sc th, table.sc td { border-bottom: 1px solid var(--rule); }

  table.sc td.v { border-left: 1px solid var(--rule); font-family: var(--display); font-size: 1.15em; }
  table.sc thead th { background: var(--band); color: #fff; border-bottom: 0; font-weight: 800; border-left: 1px solid #5a534d; }
  table.sc th.turn { color: #fff; font-family: var(--display); font-weight: 400; font-size: 1em; border-left: 0; }
  table.sc th.now { background: var(--yellow); color: var(--fg); }
  table.sc .dot { box-sizing: border-box; border: 1.5px solid #fff; }

  table.sc td.now { background: var(--yellow); }
  table.sc td.pre { color: var(--pre); }
  table.sc td.done { font-weight: 400; color: var(--fg); }

  .die { position: relative; display: inline-block; width: 1em; height: 1em; margin-right: .35em; vertical-align: -.15em; border-radius: 3px; background: var(--fg); }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const LAYOUTS = { A: "원작형", B: "판 최대형", C: "점수표 강조형", D: "세로 B + 가로 A" };
const KEYS = Object.keys(LAYOUTS);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const params = new URLSearchParams(location.search);
document.documentElement.dataset.bar = params.get("bar") === "0" ? "0" : "1";

// ---------- 게임 상태 (로직이 먼저 정한다) ----------
const S = { values: [1, 2, 3, 4, 5], held: [false, false, false, false, false], rollsLeft: 3, rolled: false, animating: false, sel: null };
const NAMES = ["하나", "두리", "세나", "네모"], COLORS = ["#d63a4c", "#1f5fbf", "#4cc477", "#b48be8"] // 노란 강조와 섞이지 않게 노랑·주황을 빼고, 밝기를 서로 다르게;
let players = [], cur = 0, turn = 1;
function setPlayers(n) {
  players = Array.from({ length: n }, (_, i) => ({ name: NAMES[i], color: COLORS[i], scores: Array(12).fill(null) }));
  cur = 0; turn = 1; newTurn();
}

const CATS = [
  ["에이스", d => sumOf(d, 1)], ["듀스", d => sumOf(d, 2)], ["트레이", d => sumOf(d, 3)],
  ["포", d => sumOf(d, 4)], ["파이브", d => sumOf(d, 5)], ["식스", d => sumOf(d, 6)],
  ["초이스", d => total(d)], ["포 다이스", d => maxCount(d) >= 4 ? total(d) : 0],
  ["풀 하우스", d => { const c = counts(d).filter(Boolean).sort(); return (c.join() === "2,3" || c.join() === "5") ? total(d) : 0; }],
  ["S. 스트레이트", d => run(d) >= 4 ? 15 : 0], ["L. 스트레이트", d => run(d) >= 5 ? 30 : 0],
  ["요트", d => maxCount(d) === 5 ? 50 : 0],
];
function counts(d) { const c = [0, 0, 0, 0, 0, 0, 0]; d.forEach(v => c[v]++); return c.slice(1); }
function sumOf(d, n) { return d.filter(v => v === n).length * n; }
function total(d) { return d.reduce((a, b) => a + b, 0); }
function maxCount(d) { return Math.max(...counts(d)); }
function run(d) { const s = new Set(d); let best = 0, c = 0; for (let i = 1; i <= 6; i++) { c = s.has(i) ? c + 1 : 0; best = Math.max(best, c); } return best; }

function resize() {

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

const bubbleLayer = document.getElementById("bubbles");

let current = "A";
function setLayout(v) {
  current = v; document.documentElement.dataset.layout = v;
  document.getElementById("vlabel").textContent = `${v} · ${LAYOUTS[v]}`;
  syncUrl(); render();
}
function syncUrl() { try { const p = new URLSearchParams(location.search); p.set("layout", current); p.set("players", players.length); history.replaceState(null, "", `${location.pathname}?${p}`); } catch {} }
const step = d => setLayout(KEYS[(KEYS.indexOf(current) + d + KEYS.length) % KEYS.length]);
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));
document.getElementById("pc").addEventListener("click", e => { const n = players.length % 4 + 1; setPlayers(n); e.currentTarget.textContent = `${n}명`; syncUrl(); });
addEventListener("keydown", e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); });

const n0 = Math.min(4, Math.max(1, +params.get("players") || 2));
setPlayers(n0); document.getElementById("pc").textContent = `${n0}명`;
const l0 = (params.get("layout") || "D").toUpperCase(); setLayout(KEYS.includes(l0) ? l0 : "D");
applyOrient();
requestAnimationFrame(() => build());
</script>
