# 코드를 올릴 때마다 도는 자동 검사. 검사 목록은 스펙(docs/specs/yacht.md)의 CI 절을 따른다.
# Biome 검사와 문서 검사는 커밋 직전 검사(.husky/pre-commit)에서도 돈다.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI 에서는 커밋하지 않으므로 pre-commit 훅을 설치하지 않는다.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json 의 packageManager 를 따른다.
      - uses: pnpm/action-setup@v6

      # 문서 검사 스크립트는 Node 의 TypeScript 직접 실행을 쓰므로 Node 24 이상이 필요하다.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 단위 테스트
        run: pnpm test

      - name: 타입 검사
        run: pnpm typecheck

      - name: Biome 검사
        run: pnpm check

      - name: 문서 검사 (용어집의 피할 말)
        run: pnpm check:docs

      # 운영 빌드에 E2E 테스트용 주사위 공급원이 빠졌는지 본다. 브라우저를 받지 않는다.
      # E2E(Playwright)는 CI 에서 돌리지 않고 로컬에서 `pnpm e2e` 로 돌린다(#15 결정).
      - name: 운영 빌드 검사 (테스트용 주사위 공급원 없음)
        run: pnpm build && pnpm check:build
